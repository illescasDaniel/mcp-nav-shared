[project]
name = "mcp-nav-shared"
version = "0.1.1"
description = "Shared helpers (LSP client, symbol resolution, formatting, workspace-root discovery) for the codenav/webnav MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "lsp", "language-server", "code-navigation"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Software Development",
	"Typing :: Typed",
]
authors = [{ name = "Daniel Illescas Romero", email = "contact@daniel-ir.eu" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/illescasDaniel/mcp-nav-shared"
Repository = "https://github.com/illescasDaniel/mcp-nav-shared"
Issues = "https://github.com/illescasDaniel/mcp-nav-shared/issues"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
	"pytest>=9.1",
	"pytest-timeout>=2.4",
	"ruff>=0.15",
	"taskipy>=1.14",
]
uploader = [
	"twine>=6.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["F", "I", "E", "S", "B", "ANN"]
fixable = ["ALL"]
ignore = ["E501", "ANN401"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "ANN"]

[tool.taskipy.tasks]
sync-uploader = { cmd = "uv sync --group dev --group uploader", help = "dev + uploader (twine) groups, needed by upload" }
test = { cmd = "uv run pytest", help = "run the tests" }
lint = { cmd = "uv run ruff check . && uv run ruff format --check .", help = "ruff lint + format check" }
format = { cmd = "uv run ruff check --fix . && uv run ruff format .", help = "format code" }
upload = { cmd = "bash scripts/publish.sh", help = "build + upload to PyPI (--testpypi, --skip-existing, --build-only after --)" }
test-package = { cmd = "bash scripts/test_package.sh", help = "install the published package in a fresh venv and smoke-test it (--testpypi after --)" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -rs"
pythonpath = ["src"]
timeout = 60
timeout_method = "thread"
